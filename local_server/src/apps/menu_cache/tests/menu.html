<body>

    <header>
        <div style="display:flex; align-items: center;">
             <button id="back-to-menu-btn">
                <i class="fas fa-chevron-left"></i> Back to Menu
            </button>
            <h1>KFC - Test Location</h1>
            <span id="current-order-display" style="margin-left: 15px; font-size: 0.9em; font-weight: bold; color: var(--secondary-color);">Order #1</span>
        </div>
        
        <button id="view-cart-btn"><i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">0</span>)</button>
    </header>

    <main id="app-container">
        <section id="menu-view">
            <h2>Our Menu</h2>
            <div id="menu-categories">
                </div>
        </section>

        <section id="cart-view" class="hidden">
            <h2>Your Order(s) Summary</h2>
            <div id="order-container">
                </div>
            
            <div id="cart-summary">
                <p>Subtotal: $<span id="cart-subtotal">0.00</span></p>
                <p>Tax (8%): $<span id="cart-tax">0.00</span></p>
                <h3>Total Amount: $<span id="cart-total">0.00</span></h3>
            </div>

            <button id="add-another-order-btn" class="secondary-btn"><i class="fas fa-plus-circle"></i> Start New Order</button>
            <button id="checkout-btn" class="primary-btn"><i class="fas fa-credit-card"></i> Proceed to Checkout</button>
        </section>
    </main>
    
    <div id="item-modal-overlay" class="modal-overlay">
        <div class="bottom-sheet">
            <button id="close-modal-btn" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 24px; cursor: pointer; color: #aaa;"><i class="fas fa-times"></i></button>
            <img id="modal-image" src="" alt="Item Image">
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
            <h3>Price: $<span id="modal-price"></span></h3>
            
            <div id="modal-quantity-controls">
                <div class="modal-qty-buttons">
                    <button onclick="updateModalQuantity(-1)"><i class="fas fa-minus"></i></button>
                    <span id="modal-quantity" style="font-size: 20px; font-weight: bold; margin: 0 15px;">1</span>
                    <button onclick="updateModalQuantity(1)"><i class="fas fa-plus"></i></button>
                </div>
                <button id="modal-add-to-cart-btn"><i class="fas fa-cart-plus"></i> Add <span id="modal-add-count">1</span> to Order</button>
            </div>
        </div>
    </div>


    <script>
        const MENU_DATA = {
            "menu": {
                "categories": [
                    {
                        "name": "Buckets & Meals",
                        "items": [
                            { "id": "1", "name": "9 Pcs Original Recipe Bucket", "price": 34.99, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Original+Bucket", "description": "9 pieces of Original Recipe chicken." },
                            { "id": "2", "name": "Zinger Burger Meal", "price": 12.50, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Zinger+Meal", "description": "Spicy Zinger fillet, lettuce, and mayo." }
                        ]
                    },
                    {
                        "name": "Sides & Desserts",
                        "items": [
                            { "id": "3", "name": "Large Fries", "price": 4.99, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=KFC+Fries", "description": "Our signature salted fries." },
                            { "id": "4", "name": "Coleslaw", "price": 3.50, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Coleslaw", "description": "Classic creamy coleslaw." }
                        ]
                    }
                ]
            }
        };

        let orders = [];
        let currentOrderId = 0;
        let allMenuItems = {};

        let modalCurrentItem = null;
        let modalQuantity = 1;

        const menuView = document.getElementById('menu-view');
        const cartView = document.getElementById('cart-view');
        const menuCategories = document.getElementById('menu-categories');
        const orderContainer = document.getElementById('order-container');
        const cartCount = document.getElementById('cart-count');
        const cartSubtotal = document.getElementById('cart-subtotal');
        const cartTax = document.getElementById('cart-tax');
        const cartTotal = document.getElementById('cart-total');
        const viewCartBtn = document.getElementById('view-cart-btn');
        const backToMenuBtn = document.getElementById('back-to-menu-btn'); 
        const addAnotherOrderBtn = document.getElementById('add-another-order-btn');
        const modalOverlay = document.getElementById('item-modal-overlay');
        const modalQuantityEl = document.getElementById('modal-quantity');
        const modalAddCountEl = document.getElementById('modal-add-count');
        const modalAddToCartBtn = document.getElementById('modal-add-to-cart-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const currentOrderDisplay = document.getElementById('current-order-display');

        const TAX_RATE = 0.08;

        function formatCurrency(amount) {
            return parseFloat(amount).toFixed(2);
        }
        
        function isItemInCurrentOrder(itemId) {
            if (orders.length === 0 || orders[currentOrderId] === undefined) return false;
            return orders[currentOrderId].items.some(i => i.id === itemId);
        }

        function renderCart() {
            let totalItems = 0;
            let grandSubtotal = 0;
            orderContainer.innerHTML = '';

            if (orders.length === 0 || orders.every(order => order.items.length === 0)) {
                orderContainer.innerHTML = '<p style="text-align: center; margin: 20px;">Your cart is empty. Please add items from the menu.</p>';
                cartCount.textContent = '0';
                updateCartSummary(0);
                document.getElementById('checkout-btn').style.display = 'none';
                return;
            } else {
                 document.getElementById('checkout-btn').style.display = 'block';
            }

            orders.forEach((order, index) => {
                let orderSubtotal = 0;
                const orderGroup = document.createElement('div');
                orderGroup.className = 'order-group';
                orderGroup.innerHTML = `<h3><i class="fas fa-receipt"></i> Order #${index + 1} ${index === currentOrderId ? '(Active)' : ''}</h3>`;

                if (order.items.length === 0) {
                    orderGroup.innerHTML += '<p>This order is empty. Add items from the menu.</p>';
                    if (orders.length > 1) {
                        orderGroup.innerHTML += `<button class="trash-btn" style="width: auto; margin-top: 10px;" onclick="removeEmptyOrder(${index})"><i class="fas fa-trash-alt"></i> Remove Empty Order #${index + 1}</button>`;
                    }
                } else {
                    order.items.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        orderSubtotal += itemTotal;
                        totalItems += item.quantity;

                        const cartItem = document.createElement('div');
                        cartItem.className = 'cart-item';
                        cartItem.innerHTML = `
                            <div class="cart-item-details">
                                <strong>${item.name}</strong>
                                <p>$${formatCurrency(item.price)} x ${item.quantity} = $${formatCurrency(itemTotal)}</p>
                            </div>
                            <div class="quantity-controls">
                                <button onclick="updateQuantity(${index}, '${item.id}', -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${index}, '${item.id}', 1)">+</button>
                                <button class="trash-btn" onclick="removeItem(${index}, '${item.id}')"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        `;
                        orderGroup.appendChild(cartItem);
                    });
                }
                
                orderGroup.innerHTML += `<p style="text-align:right; font-weight:bold; margin-top: 15px;">Order Subtotal: $${formatCurrency(orderSubtotal)}</p>`;
                orderContainer.appendChild(orderGroup);
                grandSubtotal += orderSubtotal;
            });

            cartCount.textContent = totalItems;
            updateCartSummary(grandSubtotal);
            renderMenu();
        }

        function updateQuantity(orderIndex, itemId, change) {
            const order = orders[orderIndex];
            const item = order.items.find(i => i.id === itemId);

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                removeItem(orderIndex, itemId);
            } else {
                renderCart();
            }
        }

        function removeItem(orderIndex, itemId) {
            const order = orders[orderIndex];
            order.items = order.items.filter(i => i.id !== itemId);
            
            if (order.items.length === 0) {
                if (orders.length > 1) {
                    if (orderIndex === currentOrderId) {
                        currentOrderId = Math.max(0, currentOrderId - 1);
                    }
                } else if (orders.length === 1) {
                    currentOrderId = 0;
                }
            }
            renderCart();
        }

        function removeEmptyOrder(orderIndex) {
            if (orders[orderIndex] && orders[orderIndex].items.length === 0 && orders.length > 1) {
                orders.splice(orderIndex, 1);
                if (orderIndex === currentOrderId) {
                    currentOrderId = orders.length > 0 ? Math.max(0, orderIndex - 1) : 0;
                } else if (orderIndex < currentOrderId) {
                    currentOrderId--;
                }
            } else if (orders.length === 1 && orders[0].items.length === 0) {
                alert("Cannot remove the last order. Add items or proceed to menu.");
            }
            renderCart();
        }

        function updateCartSummary(subtotal) {
            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax;

            cartSubtotal.textContent = formatCurrency(subtotal);
            cartTax.textContent = formatCurrency(tax);
            cartTotal.textContent = formatCurrency(total);
        }

        function renderMenu() {
            menuCategories.innerHTML = '';
            
            currentOrderDisplay.textContent = `Order #${currentOrderId + 1}`;

            MENU_DATA.menu.categories.forEach(category => {
                const categorySection = document.createElement('div');
                categorySection.className = 'category-section';
                categorySection.innerHTML = `<h3>${category.name}</h3>`;

                category.items.forEach(item => {
                    allMenuItems[item.id] = item; 

                    const itemCard = document.createElement('div');
                    itemCard.className = 'item-card';
                    itemCard.setAttribute('data-item-id', item.id);
                    
                    if (isItemInCurrentOrder(item.id)) {
                         itemCard.classList.add('added-to-cart');
                    }

                    itemCard.innerHTML = `
                        <img src="${item.image_url}" alt="${item.name}">
                        <div class="item-details">
                            <strong>${item.name}</strong>
                            <p>$${formatCurrency(item.price)}</p>
                            <small>${item.description}</small>
                        </div>
                        <button onclick="event.stopPropagation(); addToCart('${item.id}', 1);">Add</button>
                    `;
                    
                    itemCard.addEventListener('click', () => showItemModal(item.id));

                    categorySection.appendChild(itemCard);
                });

                menuCategories.appendChild(categorySection);
            });
        }

        function addToCart(itemId, quantity = 1) {
            if (orders[currentOrderId] === undefined) {
                 orders.push({ items: [], specialInstructions: "" });
            }

            const itemDetails = allMenuItems[itemId];
            if (!itemDetails) return; 

            const currentOrder = orders[currentOrderId];
            const existingItem = currentOrder.items.find(i => i.id === itemId);

            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                currentOrder.items.push({
                    id: itemId,
                    name: itemDetails.name,
                    price: itemDetails.price,
                    quantity: quantity,
                });
            }
            
            const totalItemsInCart = orders.reduce((sum, order) => sum + order.items.reduce((itemSum, item) => itemSum + item.quantity, 0), 0);
            cartCount.textContent = totalItemsInCart;

            viewCartBtn.style.backgroundColor = 'var(--success-color)';
            setTimeout(() => viewCartBtn.style.backgroundColor = 'var(--secondary-color)', 300);

            renderMenu(); 

            if (!cartView.classList.contains('hidden')) {
                renderCart();
            }
        }
        
        function showItemModal(itemId) {
            const item = allMenuItems[itemId];
            if (!item) return;
            
            modalCurrentItem = item;
            modalQuantity = 1; 

            document.getElementById('modal-title').textContent = item.name;
            document.getElementById('modal-description').textContent = item.description;
            document.getElementById('modal-price').textContent = formatCurrency(item.price);
            document.getElementById('modal-image').src = item.image_url;
            
            updateModalDisplay();

            modalOverlay.classList.add('active');
        }

        function updateModalDisplay() {
            modalQuantityEl.textContent = modalQuantity;
            modalAddCountEl.textContent = modalQuantity;
            modalAddToCartBtn.innerHTML = `<i class="fas fa-cart-plus"></i> Add ${modalQuantity} for $${formatCurrency(modalQuantity * modalCurrentItem.price)}`;
        }

        function updateModalQuantity(change) {
            const newQuantity = modalQuantity + change;
            if (newQuantity >= 1) {
                modalQuantity = newQuantity;
                updateModalDisplay();
            }
        }
        
        function closeItemModal() {
            modalOverlay.classList.remove('active');
            modalCurrentItem = null;
        }

        // --- Event Listeners ---
        closeModalBtn.addEventListener('click', closeItemModal);
        
        modalAddToCartBtn.addEventListener('click', () => {
            if (modalCurrentItem) {
                addToCart(modalCurrentItem.id, modalQuantity);
                closeItemModal();
            }
        });
        
        addAnotherOrderBtn.addEventListener('click', () => {
            if (orders[currentOrderId] && orders[currentOrderId].items.length === 0) {
                 alert("The current order is empty. Please add items to it before starting a new one.");
                 toggleView('menu'); 
                 return;
            }
            
            currentOrderId = orders.length; 
            orders.push({ items: [], specialInstructions: "" });
            alert(`Order #${currentOrderId + 1} is now active. Items added will belong to this new order.`);
            toggleView('menu'); 
        });

        viewCartBtn.addEventListener('click', () => {
            toggleView('cart');
        });
        
        backToMenuBtn.addEventListener('click', () => { 
            toggleView('menu');
        });


        function toggleView(target) {
            if (target === 'cart') {
                menuView.classList.add('hidden');
                cartView.classList.remove('hidden');
                viewCartBtn.style.display = 'none'; 
                backToMenuBtn.style.display = 'block'; 
                currentOrderDisplay.style.display = 'none';
                renderCart();
            } else {
                cartView.classList.add('hidden');
                menuView.classList.remove('hidden');
                viewCartBtn.style.display = 'block'; 
                backToMenuBtn.style.display = 'none'; 
                currentOrderDisplay.style.display = 'block';
                
                const totalItemsInCart = orders.reduce((sum, order) => sum + order.items.reduce((itemSum, item) => itemSum + item.quantity, 0), 0);
                viewCartBtn.innerHTML = `
                    <i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">${totalItemsInCart}</span>)
                `;
                renderMenu(); 
            }
        }

        document.getElementById('checkout-btn').addEventListener('click', () => {
            if (orders.length === 0 || orders.every(order => order.items.length === 0)) {
                alert("Your cart is empty. Please add items before checking out.");
                return;

            const grandTotal = parseFloat(cartTotal.textContent);

        /* --- Global Button Styles (for cart) --- */
        .primary-btn, .secondary-btn {
            padding: 12px 20px;

        .secondary-btn {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
        }

        .hidden {
            display: none;
        }

        /* --- Bottom Sheet/Modal Styling --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex; /* Changed from none to flex */
            justify-content: center;
            align-items: flex-end; /* Align to the bottom for bottom sheet */
            z-index: 1000;
            visibility: hidden; /* Start hidden */
            opacity: 0;
            transition: opacity 0.3s ease-out, visibility 0.3s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .bottom-sheet {
            background: white;
            width: 100%;
            max-width: 600px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        /* The transition needs to happen when the active class is present */
        .modal-overlay.active .bottom-sheet {
            transform: translateY(0);
        }
        
        #close-modal-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }
        
        #modal-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        #modal-quantity-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .modal-qty-buttons button {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        #modal-add-to-cart-btn {
            background-color: #4CAF50;

    </style>

<body>

    <header>
        <div style="display:flex; align-items: center;">
             <button id="back-to-menu-btn">
                <i class="fas fa-chevron-left"></i> Back to Menu
            </button>
            <h1>KFC - Test Location</h1>
            <span id="current-order-display" style="margin-left: 15px; font-size: 0.9em; font-weight: bold; color: var(--secondary-color);">Order #1</span>
        </div>
        
        <button id="view-cart-btn"><i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">0</span>)</button>
    </header>

    <main id="app-container">
        <section id="menu-view">
            <h2>Our Menu</h2>
            <div id="menu-categories">
                </div>
        </section>

        <section id="cart-view" class="hidden">
            <h2>Your Order(s) Summary</h2>
            <div id="order-container">
                </div>
            
            <div id="cart-summary">
                <p>Subtotal: $<span id="cart-subtotal">0.00</span></p>
                <p>Tax (8%): $<span id="cart-tax">0.00</span></p>
                <h3>Total Amount: $<span id="cart-total">0.00</span></h3>
            </div>

            <button id="add-another-order-btn" class="secondary-btn"><i class="fas fa-plus-circle"></i> Add Another Order</button>
            <button id="checkout-btn" class="primary-btn"><i class="fas fa-credit-card"></i> Proceed to Checkout</button>
        </section>
    </main>
    
    <div id="item-modal-overlay" class="modal-overlay">
        <div class="bottom-sheet">
            <button id="close-modal-btn"><i class="fas fa-times"></i></button>
            <img id="modal-image" src="" alt="Item Image">
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
            <h3>Price: $<span id="modal-price"></span></h3>
            
            <div id="modal-quantity-controls">
                <div class="modal-qty-buttons">
                    <button onclick="updateModalQuantity(-1)"><i class="fas fa-minus"></i></button>
                    <span id="modal-quantity" style="font-size: 20px; font-weight: bold; margin: 0 15px;">1</span>
                    <button onclick="updateModalQuantity(1)"><i class="fas fa-plus"></i></button>
                </div>
                <button id="modal-add-to-cart-btn"><i class="fas fa-cart-plus"></i> Add <span id="modal-add-count">1</span> to Order</button>
            </div>
        </div>
    </div>


    <script>
        const MENU_DATA = {
            "menu": {
                "categories": [
                    {
                        "name": "Buckets & Meals",
                        "items": [
                            { "id": "1", "name": "9 Pcs Original Recipe Bucket", "price": 34.99, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Original+Bucket", "description": "9 pieces of Original Recipe chicken." },
                            { "id": "2", "name": "Zinger Burger Meal", "price": 12.50, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Zinger+Meal", "description": "Spicy Zinger fillet, lettuce, and mayo." }
                        ]
                    },
                    {
                        "name": "Sides & Desserts",
                        "items": [
                            { "id": "3", "name": "Large Fries", "price": 4.99, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=KFC+Fries", "description": "Our signature salted fries." },
                            { "id": "4", "name": "Coleslaw", "price": 3.50, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Coleslaw", "description": "Classic creamy coleslaw." }
                        ]
                    }
                ]
            }
        };

        // Global state for multiple orders
        let orders = []; // Each element is an 'order' object { items: [], specialInstructions: "" }
        let currentOrderId = 0; // Tracks which order is currently being edited/added to
        let allMenuItems = {}; // Flat map for easy lookup

        // Modal state 
        let modalCurrentItem = null;
        let modalQuantity = 1;

        // DOM Elements
        const menuView = document.getElementById('menu-view');
        const cartView = document.getElementById('cart-view');
        const menuCategories = document.getElementById('menu-categories');
        const orderContainer = document.getElementById('order-container');
        const cartCount = document.getElementById('cart-count');
        const cartSubtotal = document.getElementById('cart-subtotal');
        const cartTax = document.getElementById('cart-tax');
        const cartTotal = document.getElementById('cart-total');
        const viewCartBtn = document.getElementById('view-cart-btn');
        const backToMenuBtn = document.getElementById('back-to-menu-btn'); 
        const addAnotherOrderBtn = document.getElementById('add-another-order-btn');
        const modalOverlay = document.getElementById('item-modal-overlay');
        const modalQuantityEl = document.getElementById('modal-quantity');
        const modalAddCountEl = document.getElementById('modal-add-count');
        const modalAddToCartBtn = document.getElementById('modal-add-to-cart-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const currentOrderDisplay = document.getElementById('current-order-display');


        const TAX_RATE = 0.08;

        function formatCurrency(amount) {
            return parseFloat(amount).toFixed(2);
        }
        
        /** Checks if an item is in the current active order (Crucial for visual feedback) */
        function isItemInCurrentOrder(itemId) {
            if (orders.length === 0 || orders[currentOrderId] === undefined) return false;
            return orders[currentOrderId].items.some(i => i.id === itemId);
        }

        /** Renders the full cart structure, ensuring item modifications are ORDER-SPECIFIC */
        function renderCart() {
            let totalItems = 0;
            let grandSubtotal = 0;
            orderContainer.innerHTML = '';

            if (orders.length === 0 || orders.every(order => order.items.length === 0)) {
                orderContainer.innerHTML = '<p style="text-align: center; margin: 20px;">Your cart is empty. Please add items from the menu.</p>';
                cartCount.textContent = '0';
                updateCartSummary(0);
                document.getElementById('checkout-btn').style.display = 'none';
                return;
            } else {
                 document.getElementById('checkout-btn').style.display = 'block';
            }


            orders.forEach((order, index) => {
                let orderSubtotal = 0;
                const orderGroup = document.createElement('div');
                orderGroup.className = 'order-group';
                orderGroup.innerHTML = `<h3><i class="fas fa-receipt"></i> Order #${index + 1} ${index === currentOrderId ? '(Active)' : ''}</h3>`;

                if (order.items.length === 0) {
                    orderGroup.innerHTML += '<p>This order is empty. Add items from the menu.</p>';
                    if (orders.length > 1) {
                        orderGroup.innerHTML += `<button class="trash-btn" style="width: auto; margin-top: 10px;" onclick="removeEmptyOrder(${index})"><i class="fas fa-trash-alt"></i> Remove Empty Order #${index + 1}</button>`;
                    }
                } else {
                    order.items.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        orderSubtotal += itemTotal;
                        totalItems += item.quantity;

                        const cartItem = document.createElement('div');
                        cartItem.className = 'cart-item';
                        cartItem.innerHTML = `
                            <div class="cart-item-details">
                                <strong>${item.name}</strong>
                                <p>$${formatCurrency(item.price)} x ${item.quantity} = $${formatCurrency(itemTotal)}</p>
                            </div>
                            <div class="quantity-controls">
                                <button onclick="updateQuantity(${index}, '${item.id}', -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${index}, '${item.id}', 1)">+</button>
                                <button class="trash-btn" onclick="removeItem(${index}, '${item.id}')"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        `;
                        orderGroup.appendChild(cartItem);
                    });
                }
                
                orderGroup.innerHTML += `<p style="text-align:right; font-weight:bold; margin-top: 15px;">Order Subtotal: $${formatCurrency(orderSubtotal)}</p>`;
                orderContainer.appendChild(orderGroup);
                grandSubtotal += orderSubtotal;
            });

            cartCount.textContent = totalItems;
            updateCartSummary(grandSubtotal);
            renderMenu(); // Re-render menu to update 'added' visual status 
        }

        /** Order-specific item modification */
        function updateQuantity(orderIndex, itemId, change) {
            const order = orders[orderIndex];
            const item = order.items.find(i => i.id === itemId);

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                removeItem(orderIndex, itemId);
            } else {
                renderCart();
            }
        }

        /** Order-specific item removal */
        function removeItem(orderIndex, itemId) {
            const order = orders[orderIndex];
            order.items = order.items.filter(i => i.id !== itemId);
            
            // If the deleted item makes the order empty, handle the active order pointer
            if (order.items.length === 0) {
                if (orders.length > 1) {
                    if (orderIndex === currentOrderId) {
                        // If the currently active order is emptied, point to the previous or first one
                        currentOrderId = Math.max(0, currentOrderId - 1);
                    }
                } else if (orders.length === 1) {
                    currentOrderId = 0;
                }
            }
            renderCart();
        }

        function removeEmptyOrder(orderIndex) {
            if (orders[orderIndex] && orders[orderIndex].items.length === 0 && orders.length > 1) {
                orders.splice(orderIndex, 1);
                if (orderIndex === currentOrderId) {
                    currentOrderId = orders.length > 0 ? Math.max(0, orderIndex - 1) : 0;
                } else if (orderIndex < currentOrderId) {
                    currentOrderId--;
                }
            } else if (orders.length === 1 && orders[0].items.length === 0) {
                alert("Cannot remove the last order. Add items or proceed to menu.");
            }
            renderCart();
        }

        function updateCartSummary(subtotal) {
            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax;

            cartSubtotal.textContent = formatCurrency(subtotal);
            cartTax.textContent = formatCurrency(tax);
            cartTotal.textContent = formatCurrency(total);
        }

        /** Renders the Menu, including the visual feedback for added items */
        function renderMenu() {
            menuCategories.innerHTML = '';
            
            // Update the display showing which order the user is adding to
            currentOrderDisplay.textContent = `Order #${currentOrderId + 1}`;

            MENU_DATA.menu.categories.forEach(category => {
                const categorySection = document.createElement('div');
                categorySection.className = 'category-section';
                categorySection.innerHTML = `<h3>${category.name}</h3>`;

                category.items.forEach(item => {
                    allMenuItems[item.id] = item; 

                    const itemCard = document.createElement('div');
                    itemCard.className = 'item-card';
                    itemCard.setAttribute('data-item-id', item.id);
                    
                    // Add the visual marker if the item is in the CURRENT ACTIVE order
                    if (isItemInCurrentOrder(item.id)) {
                         itemCard.classList.add('added-to-cart');
                    }

                    itemCard.innerHTML = `
                        <img src="${item.image_url}" alt="${item.name}">
                        <div class="item-details">
                            <strong>${item.name}</strong>
                            <p>$${formatCurrency(item.price)}</p>
                            <small>${item.description}</small>
                        </div>
                        <button onclick="event.stopPropagation(); addToCart('${item.id}', 1);">Add</button>
                    `;
                    
                    // Add click handler to show bottom sheet
                    itemCard.addEventListener('click', () => showItemModal(item.id));

                    categorySection.appendChild(itemCard);
                });

                menuCategories.appendChild(categorySection);
            });
        }

        /** Goal: Add item(s) to the cart (Core Functionality) */
        function addToCart(itemId, quantity = 1) {
            // Check if the current order exists
            if (orders[currentOrderId] === undefined) {
                 orders.push({ items: [], specialInstructions: "" });
            }

            const itemDetails = allMenuItems[itemId];
            if (!itemDetails) return; 

            const currentOrder = orders[currentOrderId];
            const existingItem = currentOrder.items.find(i => i.id === itemId);

            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                currentOrder.items.push({
                    id: itemId,
                    name: itemDetails.name,
                    price: itemDetails.price,
                    quantity: quantity,
                });
            }
            
            // Provide instant feedback (HCI Principle)
            const totalItemsInCart = orders.reduce((sum, order) => sum + order.items.reduce((itemSum, item) => itemSum + item.quantity, 0), 0);
            cartCount.textContent = totalItemsInCart;

            viewCartBtn.style.backgroundColor = '#4CAF50';
            setTimeout(() => viewCartBtn.style.backgroundColor = 'var(--secondary-color)', 300);

            // Re-render menu to show the item card as 'added'
            renderMenu(); 

            // If already in cart view, update immediately
            if (!cartView.classList.contains('hidden')) {
                renderCart();
            }
        }
        
        // --- Modal/Bottom Sheet Functions (Fix for visibility) ---
        function showItemModal(itemId) {
            const item = allMenuItems[itemId];
            if (!item) return;
            
            modalCurrentItem = item;
            
            // Check if item is already in the current active order
            const existingInOrder = orders[currentOrderId].items.find(i => i.id === itemId);
            modalQuantity = existingInOrder ? existingInOrder.quantity : 1;
            
            // If the item exists in the order, clicking the card should let them edit it.
            // However, the modal will always start quantity at 1 for simplicity here,
            // unless we want to implement a more complex edit flow. STICKING TO ADD.

            modalQuantity = 1; 

            document.getElementById('modal-title').textContent = item.name;
            document.getElementById('modal-description').textContent = item.description;
            document.getElementById('modal-price').textContent = formatCurrency(item.price);
            document.getElementById('modal-image').src = item.image_url;
            
            updateModalDisplay();

            // Set the visibility and opacity before activating the transition
            modalOverlay.classList.add('active');
        }

        function updateModalDisplay() {
            modalQuantityEl.textContent = modalQuantity;
            modalAddCountEl.textContent = modalQuantity;
            modalAddToCartBtn.innerHTML = `<i class="fas fa-cart-plus"></i> Add ${modalQuantity} for $${formatCurrency(modalQuantity * modalCurrentItem.price)}`;
        }

        function updateModalQuantity(change) {
            const newQuantity = modalQuantity + change;
            if (newQuantity >= 1) {
                modalQuantity = newQuantity;
                updateModalDisplay();
            }
        }
        
        function closeItemModal() {
            modalOverlay.classList.remove('active');
            modalCurrentItem = null;
        }

        // --- Event Listeners ---
        closeModalBtn.addEventListener('click', closeItemModal);
        
        modalAddToCartBtn.addEventListener('click', () => {
            if (modalCurrentItem) {
                addToCart(modalCurrentItem.id, modalQuantity);
                closeItemModal();
            }
        });
        
        addAnotherOrderBtn.addEventListener('click', () => {
            // If the current active order is empty, don't create a new one, just switch to menu
            if (orders[currentOrderId] && orders[currentOrderId].items.length === 0) {
                 alert("The current order is empty. Please add items to it before starting a new one.");
                 toggleView('menu'); 
                 return;
            }
            
            // Create a new order and set it as the active one
            currentOrderId = orders.length; 
            orders.push({ items: [], specialInstructions: "" });
            alert(`Order #${currentOrderId + 1} is now active. Items added will belong to this new order.`);
            toggleView('menu'); 
        });

        viewCartBtn.addEventListener('click', () => {
            toggleView('cart');
        });
        
        backToMenuBtn.addEventListener('click', () => { 
            toggleView('menu');
        });


        function toggleView(target) {
            if (target === 'cart') {
                menuView.classList.add('hidden');
                cartView.classList.remove('hidden');
                viewCartBtn.style.display = 'none'; 
                backToMenuBtn.style.display = 'block'; 
                currentOrderDisplay.style.display = 'none'; // Hide current order context in cart view
                renderCart();
            } else {
                cartView.classList.add('hidden');
                menuView.classList.remove('hidden');
                viewCartBtn.style.display = 'block'; 
                backToMenuBtn.style.display = 'none'; 
                currentOrderDisplay.style.display = 'block'; // Show current order context in menu view
                
                viewCartBtn.innerHTML = `
                    <i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">${cartCount.textContent}</span>)
                `;
                renderMenu(); 
            }
        }

        document.getElementById('checkout-btn').addEventListener('click', () => {
            if (orders.length === 0 || orders.every(order => order.items.length === 0)) {
                alert("Your cart is empty. Please add items before checking out.");
                return;
            }
            
            const grandTotal = parseFloat(cartTotal.textContent);
            const non_empty_orders = orders.filter(order => order.items.length > 0);

            const finalOrders = non_empty_orders.map((order, index) => {
                let orderSubtotal = 0;
                const orderItems = order.items.map(item => {
                    const total = item.price * item.quantity;
                    orderSubtotal += total;
                    return {
                        "id": item.id,
                        "name": item.name,
                        "price": formatCurrency(item.price),
                        "quantity": item.quantity,
                        "total": formatCurrency(total)
                    };
                });
                
                const taxAmount = orderSubtotal * TAX_RATE;
                
                return {
                    "restaurant": "test_restaurant",
                    "local_order_id": `TEST-${Math.random().toString(36).substring(2, 10).toUpperCase()}`, 
                    "order_items": orderItems,
                    "total_amount": formatCurrency(orderSubtotal + taxAmount),
                    "tax_amount": formatCurrency(taxAmount),
                    "special_instructions": order.specialInstructions || `Order #${index + 1} Instructions` 
                };
            });

            console.log("--- FINAL PAYLOAD SENT TO SERVER ---");
            console.log(JSON.stringify(finalOrders, null, 2));

            alert(`✅ Successfully created ${finalOrders.length} order(s). Proceeding to final payment screen. Total Due: $${formatCurrency(grandTotal)}`);
        });


        // Initialize the application
        function init() {
            if (orders.length === 0) {
                orders.push({ items: [], specialInstructions: "" }); 
                currentOrderId = 0;
            }
            MENU_DATA.menu.categories.forEach(category => {
                category.items.forEach(item => {
                    allMenuItems[item.id] = item;
                });
            });
            renderMenu();
            renderCart(); 
        }

        init();
    </script>

                    <span id="modal-quantity" style="font-size: 20px; font-weight: bold; margin: 0 15px;">1</span>
                    <button onclick="updateModalQuantity(1)"><i class="fas fa-plus"></i></button>

            </div>
        </div>

    <script>
        const MENU_DATA = {
            "menu": {
                "categories": [
                    {
                        "name": "Buckets & Meals",
                        "items": [
                            { "id": "1", "name": "9 Pcs Original Recipe Bucket", "price": 34.99, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Original+Bucket", "description": "9 pieces of Original Recipe chicken." },
                            { "id": "2", "name": "Zinger Burger Meal", "price": 12.50, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Zinger+Meal", "description": "Spicy Zinger fillet, lettuce, and mayo." }
                        ]
                    },
                    {
                        "name": "Sides & Desserts",
                        "items": [
                            { "id": "3", "name": "Large Fries", "price": 4.99, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=KFC+Fries", "description": "Our signature salted fries." },
                            { "id": "4", "name": "Coleslaw", "price": 3.50, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Coleslaw", "description": "Classic creamy coleslaw." }
                        ]
                    }
                ]
            }
        };

        // Global state for multiple orders
        let orders = []; // Each element is an 'order' object { items: [], specialInstructions: "" }
        let currentOrderId = 0; // Tracks which order is currently being edited/added to
        let allMenuItems = {}; // Flat map for easy lookup

        const cartSubtotal = document.getElementById('cart-subtotal');
        const cartTax = document.getElementById('cart-tax');
        const cartTotal = document.getElementById('cart-total');
        const viewCartBtn = document.getElementById('view-cart-btn');
        const backToMenuBtn = document.getElementById('back-to-menu-btn'); // New
        const addAnotherOrderBtn = document.getElementById('add-another-order-btn');
        const modalOverlay = document.getElementById('item-modal-overlay');
        const modalQuantityEl = document.getElementById('modal-quantity');
        const modalAddCountEl = document.getElementById('modal-add-count');
        const modalAddToCartBtn = document.getElementById('modal-add-to-cart-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');


        const TAX_RATE = 0.08;

        /** HCI Principle: Consistency, Affordance & Feedback

        function formatCurrency(amount) {
            return parseFloat(amount).toFixed(2);

        /** Checks if an item is in the current active order (New) */
        function isItemInCurrentOrder(itemId) {
            if (orders.length === 0) return false;
            return orders[currentOrderId].items.some(i => i.id === itemId);
        }

        /** HCI Principle: System Status Visibility & IA Principle: Organization
         * Renders the full cart structure, including multiple orders.
         */
        function renderCart() {
            let totalItems = 0;
            let grandSubtotal = 0;
            orderContainer.innerHTML = '';

            if (orders.length === 0 || orders.every(order => order.items.length === 0)) {
                orderContainer.innerHTML = '<p>Your cart is empty. Please add items from the menu.</p>';
                cartCount.textContent = '0';
                updateCartSummary(0);
                document.getElementById('checkout-btn').style.display = 'none';
                return;
            } else {
                 document.getElementById('checkout-btn').style.display = 'block';
            }


            orders.forEach((order, index) => {
                let orderSubtotal = 0;
                const orderGroup = document.createElement('div');
                orderGroup.className = 'order-group';
                orderGroup.innerHTML = `<h3>Order #${index + 1} ${index === currentOrderId ? '(Adding Items)' : ''}</h3>`;

                if (order.items.length === 0) {
                    orderGroup.innerHTML += '<p>This order is empty. Add items from the menu, or use the trash icon to remove this empty order.</p>';
                    if (orders.length > 1) {
                        orderGroup.innerHTML += `<button class="trash-btn" style="width: auto; margin-top: 10px;" onclick="removeEmptyOrder(${index})"><i class="fas fa-trash-alt"></i> Remove Empty Order #${index + 1}</button>`;
                    }
                } else {
                    order.items.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        orderSubtotal += itemTotal;
                        totalItems += item.quantity;

                        const cartItem = document.createElement('div');
                        cartItem.className = 'cart-item';
                        cartItem.innerHTML = `
                            <div class="cart-item-details">
                                <strong>${item.name}</strong>
                                <p>$${formatCurrency(item.price)} x ${item.quantity} = $${formatCurrency(itemTotal)}</p>
                            </div>
                            <div class="quantity-controls">
                                <button onclick="updateQuantity(${index}, '${item.id}', -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${index}, '${item.id}', 1)">+</button>
                                <button class="trash-btn" onclick="removeItem(${index}, '${item.id}')"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        `;
                        orderGroup.appendChild(cartItem);
                    });
                }
                
                orderGroup.innerHTML += `<p style="text-align:right; font-weight:bold;">Order Subtotal: $${formatCurrency(orderSubtotal)}</p>`;
                orderContainer.appendChild(orderGroup);
                grandSubtotal += orderSubtotal;
            });

            cartCount.textContent = totalItems;
            updateCartSummary(grandSubtotal);
            renderMenu(); // Re-render menu to update 'added' visual status (New)
        }

        function updateQuantity(orderIndex, itemId, change) {
            const order = orders[orderIndex];
            const item = order.items.find(i => i.id === itemId);

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                removeItem(orderIndex, itemId);
            } else {
                renderCart();
            }
        }

        function removeItem(orderIndex, itemId) {
            const order = orders[orderIndex];
            order.items = order.items.filter(i => i.id !== itemId);
            if (orders.length === 1) {
                currentOrderId = 0;
            } else if (order.items.length === 0) {
                if (orderIndex === currentOrderId) {
                    currentOrderId = Math.max(0, currentOrderId - 1);
                }
            }
            renderCart();
        }

        function removeEmptyOrder(orderIndex) {
            if (orders[orderIndex] && orders[orderIndex].items.length === 0 && orders.length > 1) {
                orders.splice(orderIndex, 1);
                if (orderIndex === currentOrderId) {
                    currentOrderId = orders.length > 0 ? Math.max(0, orderIndex - 1) : 0;
                } else if (orderIndex < currentOrderId) {
                    currentOrderId--;
                }
            } else if (orders.length === 1 && orders[0].items.length === 0) {
                alert("Cannot remove the last order. Add items or proceed to menu.");
            }
            renderCart();
        }

        function updateCartSummary(subtotal) {
            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax;

            cartSubtotal.textContent = formatCurrency(subtotal);
            cartTax.textContent = formatCurrency(tax);
            cartTotal.textContent = formatCurrency(total);
        }

        /** Renders the Menu, including the visual feedback for added items (Updated) */
        function renderMenu() {
            menuCategories.innerHTML = '';
            MENU_DATA.menu.categories.forEach(category => {
                const categorySection = document.createElement('div');
                categorySection.className = 'category-section';
                categorySection.innerHTML = `<h3>${category.name}</h3>`;

                category.items.forEach(item => {
                    // Populate the flat map on first render
                    allMenuItems[item.id] = item; 

                    const itemCard = document.createElement('div');
                    itemCard.className = 'item-card';
                    itemCard.setAttribute('data-item-id', item.id);
                    
                    // New: Add the visual marker if the item is in the current order
                    if (isItemInCurrentOrder(item.id)) {
                         itemCard.classList.add('added-to-cart');
                    }

                    itemCard.innerHTML = `
                        <img src="${item.image_url}" alt="${item.name}">
                        <div class="item-details">
                            <strong>${item.name}</strong>
                            <p>$${formatCurrency(item.price)}</p>
                            <small>${item.description}</small>
                        </div>
                        <button onclick="event.stopPropagation(); addToCart('${item.id}', 1);">Add</button>
                    `;
                    
                    // New: Add click handler to show bottom sheet
                    itemCard.addEventListener('click', () => showItemModal(item.id));

                    categorySection.appendChild(itemCard);
                });

                menuCategories.appendChild(categorySection);
            });
        }

        /** Goal: Add item(s) to the cart (Core Functionality) (Updated for quantity) */
        function addToCart(itemId, quantity = 1) {
            if (orders.length === 0 || orders[currentOrderId] === undefined) {
                orders.push({ items: [], specialInstructions: "" });
                currentOrderId = 0;
            }

            const itemDetails = allMenuItems[itemId];
            if (!itemDetails) return; // Safety check

            const currentOrder = orders[currentOrderId];
            const existingItem = currentOrder.items.find(i => i.id === itemId);

            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                currentOrder.items.push({
                    id: itemId,
                    name: itemDetails.name,
                    price: itemDetails.price,
                    quantity: quantity,
                });
            }
            
            // Provide instant feedback (HCI Principle)
            const currentCount = parseInt(cartCount.textContent) + quantity;
            cartCount.textContent = currentCount;
            viewCartBtn.style.backgroundColor = '#4CAF50';
            setTimeout(() => viewCartBtn.style.backgroundColor = 'var(--secondary-color)', 300);

            // Re-render menu to show the item card as 'added'
            renderMenu(); 

            // If already in cart view, update immediately
            if (!cartView.classList.contains('hidden')) {
                renderCart();
            }
        }
        
        // --- Modal/Bottom Sheet Functions (New) ---
        function showItemModal(itemId) {
            const item = allMenuItems[itemId];
            if (!item) return;
            
            modalCurrentItem = item;
            modalQuantity = 1; // Reset quantity on open

            document.getElementById('modal-title').textContent = item.name;
            document.getElementById('modal-description').textContent = item.description;
            document.getElementById('modal-price').textContent = formatCurrency(item.price);
            document.getElementById('modal-image').src = item.image_url;
            
            updateModalDisplay();

            modalOverlay.classList.add('active');
        }

        function updateModalDisplay() {
             // Update quantity display
            modalQuantityEl.textContent = modalQuantity;
            // Update button text to reflect quantity being added
            modalAddCountEl.textContent = modalQuantity;
            // Update button text to show the total price (Affordance)
            modalAddToCartBtn.innerHTML = `<i class="fas fa-cart-plus"></i> Add ${modalQuantity} for $${formatCurrency(modalQuantity * modalCurrentItem.price)}`;
        }

        function updateModalQuantity(change) {
            const newQuantity = modalQuantity + change;
            if (newQuantity >= 1) {
                modalQuantity = newQuantity;
                updateModalDisplay();
            }
        }
        
        function closeItemModal() {
            modalOverlay.classList.remove('active');
            modalCurrentItem = null;
        }

        // --- Event Listeners ---
        closeModalBtn.addEventListener('click', closeItemModal);
        
        modalAddToCartBtn.addEventListener('click', () => {
            if (modalCurrentItem) {
                addToCart(modalCurrentItem.id, modalQuantity);
                closeItemModal();
            }
        });
        
        addAnotherOrderBtn.addEventListener('click', () => {
            if (orders[currentOrderId] && orders[currentOrderId].items.length === 0) {
                alert("Please add items to the current order before starting a new one.");
                return;
            }

            currentOrderId = orders.length; 
            orders.push({ items: [], specialInstructions: "" });
            alert(`Order #${currentOrderId + 1} has been started. Items added now will belong to this new order.`);
            toggleView('menu'); 
        });

        // View Toggle (Updated to handle the new explicit back button)
        viewCartBtn.addEventListener('click', () => {
            toggleView('cart');
        });
        
        backToMenuBtn.addEventListener('click', () => { // New listener
            toggleView('menu');
        });


        function toggleView(target) {
            if (target === 'cart') {
                menuView.classList.add('hidden');
                cartView.classList.remove('hidden');
                viewCartBtn.style.display = 'none'; // Hide the primary cart button
                backToMenuBtn.style.display = 'block'; // Show the explicit back button
                renderCart();
            } else {
                cartView.classList.add('hidden');
                menuView.classList.remove('hidden');
                viewCartBtn.style.display = 'block'; // Show the primary cart button
                backToMenuBtn.style.display = 'none'; // Hide the explicit back button
                // Update cart count on the visible button
                viewCartBtn.innerHTML = `
                    <i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">${cartCount.textContent}</span>)
                `;

                renderMenu();

        document.getElementById('checkout-btn').addEventListener('click', () => {

        function init() {

            <button id="add-another-order-btn" class="secondary-btn"><i class="fas fa-plus-circle"></i> Add Another Order</button>
            <button id="checkout-btn" class="primary-btn"><i class="fas fa-credit-card"></i> Proceed to Checkout</button>

    <script>
        const MENU_DATA = {

                            { "id": "2", "name": "Zinger Burger Meal", "price": 12.50, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Zinger+Meal", "description": "Spicy Zinger fillet, lettuce, and mayo." }
                        ]
                    },
                    {
                        "name": "Sides & Desserts",
                        "items": [

                            { "id": "4", "name": "Coleslaw", "price": 3.50, "image_url": "https://placehold.co/400x250/C8102E/FFFFFF?text=Coleslaw", "description": "Classic creamy coleslaw." }
                        ]
                    }
                ]
            }
        };

        // Global state for multiple orders
        let orders = []; // Each element is an 'order' object { items: [], specialInstructions: "" }

        // DOM Elements
        const menuView = document.getElementById('menu-view');

        const cartCount = document.getElementById('cart-count');
        const cartSubtotal = document.getElementById('cart-subtotal');
        const cartTax = document.getElementById('cart-tax');
        const cartTotal = document.getElementById('cart-total');

        const TAX_RATE = 0.08;

        /** HCI Principle: Consistency, Affordance & Feedback
         * Ensures currency is formatted correctly and instantly updates UI.
         */
        function formatCurrency(amount) {
            // Using toFixed(2) to ensure two decimal places for currency
            return parseFloat(amount).toFixed(2);
        }

        /** HCI Principle: System Status Visibility & IA Principle: Organization
         * Renders the full cart structure, including multiple orders.
         */
        function renderCart() {
            let totalItems = 0;
            let grandSubtotal = 0;
            orderContainer.innerHTML = '';

            if (orders.length === 0 || orders.every(order => order.items.length === 0)) {
                orderContainer.innerHTML = '<p>Your cart is empty. Please add items from the menu.</p>';
                cartCount.textContent = '0';
                updateCartSummary(0);
                // Hide checkout buttons if nothing is ordered
                document.getElementById('checkout-btn').style.display = 'none';
                return;
            } else {
                 document.getElementById('checkout-btn').style.display = 'block';
            }


            orders.forEach((order, index) => {
                let orderSubtotal = 0;
                const orderGroup = document.createElement('div');
                orderGroup.className = 'order-group';
                orderGroup.innerHTML = `<h3>Order #${index + 1} ${index === currentOrderId ? '(Adding Items)' : ''}</h3>`;

                if (order.items.length === 0) {
                    orderGroup.innerHTML += '<p>This order is empty. Add items from the menu, or use the trash icon to remove this empty order.</p>';
                    // Option to remove the current empty order if multiple exist (User Control)
                    if (orders.length > 1) {
                        orderGroup.innerHTML += `<button class="trash-btn" style="width: auto; margin-top: 10px;" onclick="removeEmptyOrder(${index})"><i class="fas fa-trash-alt"></i> Remove Empty Order #${index + 1}</button>`;
                    }
                } else {
                    order.items.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        orderSubtotal += itemTotal;
                        totalItems += item.quantity;

                        const cartItem = document.createElement('div');
                        cartItem.className = 'cart-item';
                        cartItem.innerHTML = `
                            <div class="cart-item-details">
                                <strong>${item.name}</strong>
                                <p>$${formatCurrency(item.price)} x ${item.quantity} = $${formatCurrency(itemTotal)}</p>
                            </div>
                            <div class="quantity-controls">
                                <button onclick="updateQuantity(${index}, '${item.id}', -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQuantity(${index}, '${item.id}', 1)">+</button>
                                <button class="trash-btn" onclick="removeItem(${index}, '${item.id}')"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        `;
                        orderGroup.appendChild(cartItem);
                    });
                }
                
                orderGroup.innerHTML += `<p style="text-align:right; font-weight:bold;">Order Subtotal: $${formatCurrency(orderSubtotal)}</p>`;
                orderContainer.appendChild(orderGroup);
                grandSubtotal += orderSubtotal;
            });

            cartCount.textContent = totalItems;
            updateCartSummary(grandSubtotal);
        }

        /** HCI Principle: User Control & Freedom
         * Allows customer to change item quantity or delete an item.
         */
        function updateQuantity(orderIndex, itemId, change) {
            const order = orders[orderIndex];
            const item = order.items.find(i => i.id === itemId);

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {
                removeItem(orderIndex, itemId);
            } else {
                renderCart();
            }
        }

        function removeItem(orderIndex, itemId) {
            const order = orders[orderIndex];
            order.items = order.items.filter(i => i.id !== itemId);
            // If the deleted item makes the order empty, check if we should switch context
            if (order.items.length === 0) {
                if (orders.length > 1) {
                    // Automatically switch the 'current' order pointer if we just emptied the active one
                    if (orderIndex === currentOrderId) {
                        currentOrderId = Math.max(0, currentOrderId - 1);
                    }
                } else if (orders.length === 1) {
                    // If it's the only order, we just leave it empty.
                    currentOrderId = 0;
                }
            }
            renderCart();
        }

        function removeEmptyOrder(orderIndex) {
            if (orders[orderIndex] && orders[orderIndex].items.length === 0 && orders.length > 1) {
                orders.splice(orderIndex, 1);
                // Adjust currentOrderId if the removed order was the current one
                if (orderIndex === currentOrderId) {
                    currentOrderId = orders.length > 0 ? Math.max(0, orderIndex - 1) : 0;
                } else if (orderIndex < currentOrderId) {
                    currentOrderId--; // Shift the pointer back if a previous order was deleted
                }
            } else if (orders.length === 1 && orders[0].items.length === 0) {
                alert("Cannot remove the last order. Add items or proceed to menu.");
            }
            renderCart();
        }

        /** IA Principle: Consistency & IA Goal: Calculating Subtotal/Tax/Total
         * Helper function for final calculations.
         */
        function updateCartSummary(subtotal) {
            const tax = subtotal * TAX_RATE;
            const total = subtotal + tax;

            cartSubtotal.textContent = formatCurrency(subtotal);
            cartTax.textContent = formatCurrency(tax);
            cartTotal.textContent = formatCurrency(total);
        }

        /** IA Principle: Organization & Labeling (Menu Structure)
         * Dynamically creates the menu interface.
         */
        function renderMenu() {
            MENU_DATA.menu.categories.forEach(category => {
                const categorySection = document.createElement('div');
                categorySection.className = 'category-section';
                categorySection.innerHTML = `<h3>${category.name}</h3>`;

                category.items.forEach(item => {
                    const itemCard = document.createElement('div');
                    itemCard.className = 'item-card';
                    itemCard.innerHTML = `
                        <img src="${item.image_url}" alt="${item.name}">
                        <div class="item-details">
                            <strong>${item.name}</strong>
                            <p>$${formatCurrency(item.price)}</p>
                            <small>${item.description}</small>
                        </div>
                        <button onclick="addToCart('${item.id}', '${item.name}', ${item.price})">Add</button>
                    `;
                    categorySection.appendChild(itemCard);
                });

                menuCategories.appendChild(categorySection);
            });
        }

        /** Goal: Add, Delete, and Update items (Core Functionality)
         * Handles adding an item to the CURRENT active order.
         */
        function addToCart(itemId, itemName, itemPrice) {
            if (orders.length === 0 || orders[currentOrderId] === undefined) {
                // Should only happen on initial load, but ensures resilience
                orders.push({ items: [], specialInstructions: "" });
                currentOrderId = 0;
            }

            const currentOrder = orders[currentOrderId];
            const existingItem = currentOrder.items.find(i => i.id === itemId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                currentOrder.items.push({
                    id: itemId,
                    name: itemName,
                    price: itemPrice,
                    quantity: 1,
                });
            }
            
            // Provide instant feedback (HCI Principle)
            const currentCount = parseInt(cartCount.textContent) + 1;
            cartCount.textContent = currentCount;
            // Simple visual cue: temporarily change button color
            viewCartBtn.style.backgroundColor = '#4CAF50';
            setTimeout(() => viewCartBtn.style.backgroundColor = '#FFC72C', 300);

            // If already in cart view, update immediately
            if (!cartView.classList.contains('hidden')) {
                renderCart();
            }
        }

        /** Goal: Create another order in the same cart
         * Allows the core multiple-order functionality.
         */
        addAnotherOrderBtn.addEventListener('click', () => {
            // Check if the current order is empty, if so, don't create a new one
            if (orders[currentOrderId] && orders[currentOrderId].items.length === 0) {
                alert("Please add items to the current order before starting a new one.");
                return;
            }

            // Finalize the current order and start a new one
            currentOrderId = orders.length; // New order index
            orders.push({ items: [], specialInstructions: "" });
            alert(`Order #${currentOrderId + 1} has been started. Items added now will belong to this new order.`);
            // Switch back to Menu view (IA principle: Guidance)
            toggleView('menu'); 
        });

        // View Toggle
        viewCartBtn.addEventListener('click', () => {
            toggleView(cartView.classList.contains('hidden') ? 'cart' : 'menu');
        });

        function toggleView(target) {
            if (target === 'cart') {
                menuView.classList.add('hidden');
                cartView.classList.remove('hidden');
                viewCartBtn.innerHTML = '<i class="fas fa-utensils"></i> Back to Menu';
                renderCart();
            } else {
                cartView.classList.add('hidden');
                menuView.classList.remove('hidden');
                // Re-render the cart count in the header button
                viewCartBtn.innerHTML = `
                    <i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">${cartCount.textContent}</span>)
                `;
            }
        }

        document.getElementById('checkout-btn').addEventListener('click', () => {
            // Ensure there are actual items in the cart
            if (orders.length === 0 || orders.every(order => order.items.length === 0)) {
                alert("Your cart is empty. Please add items before checking out.");
                return;
            }
            
            const grandTotal = parseFloat(cartTotal.textContent);
            
            // Filter out any accidentally empty orders before processing
            const non_empty_orders = orders.filter(order => order.items.length > 0);

            // Final Order Structure Generation for the server
            const finalOrders = non_empty_orders.map((order, index) => {
                let orderSubtotal = 0;
                const orderItems = order.items.map(item => {
                    const total = item.price * item.quantity;
                    orderSubtotal += total;
                    return {
                        "id": item.id,
                        "name": item.name,
                        "price": formatCurrency(item.price),
                        "quantity": item.quantity,
                        "total": formatCurrency(total)
                    };
                });
                
                const taxAmount = orderSubtotal * TAX_RATE;
                
                return {
                    "restaurant": "test_restaurant",
                    // Use a more robust (but simulated) ID generation for the final structure
                    "local_order_id": `TEST-${Math.random().toString(36).substring(2, 10).toUpperCase()}`, 
                    "order_items": orderItems,
                    "total_amount": formatCurrency(orderSubtotal + taxAmount),
                    "tax_amount": formatCurrency(taxAmount),
                    "special_instructions": order.specialInstructions || `Order #${index + 1} Instructions` 
                };
            });

            console.log("--- FINAL PAYLOAD SENT TO SERVER ---");
            console.log(JSON.stringify(finalOrders, null, 2)); // Print in a readable JSON format

            alert(`✅ Successfully created ${finalOrders.length} order(s). Proceeding to final payment screen. Total Due: $${formatCurrency(grandTotal)}`);
        });


        // Initialize the application
        function init() {
            // Ensure the first order object exists upon load
            if (orders.length === 0) {
                orders.push({ items: [], specialInstructions: "" }); 
                currentOrderId = 0;
            }
            renderMenu();
            renderCart(); // Call once to initialize summary/count and hide checkout if empty
        }

        init();
    </script>
